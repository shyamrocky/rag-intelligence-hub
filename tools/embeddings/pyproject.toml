[project]
name = "rag-m4-local-embeddings"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-intelligence-hub",
    "sentence-transformers==5.1.2",
    "transformers==4.57.1",
    "torch==2.8.0",
    "numpy==2.2.6",
    "safetensors==0.6.2",
    "huggingface-hub==0.36.0",
    "tokenizers==0.22.2",
    "langchain-text-splitters==1.1.2",
    "langchain-core==1.7.0",
]

[tool.uv]
package = false
override-dependencies = [
    "pymupdf==1.28.2",
    "pydantic==2.14.1",
    "markdown-it-py==4.2.0",
]

[tool.uv.sources]
rag-intelligence-hub = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest==9.1.0", "ruff==0.14.14"]
